name: 自动检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: 语法、版本与功能测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 第六主版本
      - name: 配置开发环境
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # 第六主版本
        with:
          node-version: '24'
          cache: npm
      - name: 安装锁定的测试依赖
        run: npm ci --ignore-scripts
      - name: 检查语法和版本
        run: npm run check
      - name: 运行测试
        run: npm test
